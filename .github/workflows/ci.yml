name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install openpyxl (template xlsx parse)
        run: pip install --user openpyxl
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Addon tests
        working-directory: addon
        run: |
          npm ci
          npm test
          npm run typecheck

